name: Build release

# Runs when you push a tag like v0.2.0. Builds the addon zip and publishes a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Work out the version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the addon zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p build/ForeverLedger
          cp ForeverLedger.toc *.lua README.md CHANGELOG.md LICENSE build/ForeverLedger/
          sed -i "s/@project-version@/${VERSION}/" build/ForeverLedger/ForeverLedger.toc
          cd build && zip -r "../ForeverLedger-${VERSION}.zip" ForeverLedger

      - name: Copy this version's notes from the changelog
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "No changelog entry for ${VERSION}." > release-notes.md; fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Forever Ledger ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: ForeverLedger-${{ steps.ver.outputs.version }}.zip
          prerelease: ${{ startsWith(steps.ver.outputs.version, '0.') }}

      # CurseForge (project 1720193). Needs the CF_API_TOKEN secret. The game version is
      # worked out from the .toc's Interface line (16001 = 1.60.1); if CurseForge doesn't
      # list exactly one match, nothing is uploaded and the log shows what it does list.
      # A failure here never undoes the GitHub release above.
      - name: Upload to CurseForge
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "No CF_API_TOKEN secret, skipping."; exit 0; fi
          VERSION="${{ steps.ver.outputs.version }}"
          PROJECT=$(grep -m1 '^## X-Curse-Project-ID:' ForeverLedger.toc | sed 's/.*: *//' | tr -d '\r')
          INTERFACE=$(grep -m1 '^## Interface:' ForeverLedger.toc | sed 's/.*: *//' | tr -d '\r')
          GAME="$((INTERFACE / 10000)).$(((INTERFACE / 100) % 100)).$((INTERFACE % 100))"
          echo "Project $PROJECT, game version $GAME"
          curl -sf -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions > versions.json
          IDS=$(jq -c --arg g "$GAME" '[.[] | select(.name == $g) | .id]' versions.json)
          if [ "$(echo "$IDS" | jq length)" != "1" ]; then
            echo "Expected one CurseForge game version named $GAME, found: $IDS"
            jq -c --arg g "$GAME" '.[] | select(.name == $g)' versions.json
            exit 1
          fi
          case "$VERSION" in 0.*) TYPE=beta ;; *) TYPE=release ;; esac
          jq -n --rawfile log release-notes.md --arg name "Forever Ledger $VERSION" --arg type "$TYPE" --argjson ids "$IDS" \
            '{changelog: $log, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: $type}' > metadata.json
          curl -sf -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<metadata.json" \
            -F "file=@ForeverLedger-${VERSION}.zip" \
            "https://wow.curseforge.com/api/projects/${PROJECT}/upload-file"
          echo
          echo "Uploaded Forever Ledger $VERSION to CurseForge ($TYPE)."
