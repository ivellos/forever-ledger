name: Discord permissions

# Report, plan or apply the Forever Ledger server's channel permissions, from
# discord-bot/permissions.json. Run by hand only. The bot needs the "Bot admin" role
# (Administrator) while this runs; take it off afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report, plan or apply"
        required: true
        default: report
        type: choice
        options: [report, plan, apply]

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Permissions
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: "1555189575650123776"
        run: python3 .github/scripts/discord_perms.py "${{ inputs.mode }}"
