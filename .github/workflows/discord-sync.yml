name: Discord sync

# Discord forum posts in #bug-reports and #feature-requests become GitHub issues (every
# 15 minutes, or by hand from the Actions tab), and closing or reopening one of those
# issues posts back in its Discord thread. See .github/scripts/discord_sync.py.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  issues:
    types: [closed, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: discord-sync
  cancel-in-progress: false

env:
  GUILD_ID: "1555189575650123776"
  BUG_FORUM: "1555195887771451412"
  IDEA_FORUM: "1555196054658490388"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then echo "No DISCORD_BOT_TOKEN secret, skipping."; exit 0; fi
          if [ "${{ github.event_name }}" = "issues" ]; then
            python3 .github/scripts/discord_sync.py issue
          else
            python3 .github/scripts/discord_sync.py poll
          fi
